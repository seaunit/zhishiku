services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: zhishiku
      POSTGRES_USER: zhishiku
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-dev-password-change-me}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ../.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhishiku -d zhishiku"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-minio-password-change-me}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ../.data/minio:/data
