server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /kb
  forward-headers-strategy: framework

spring:
  application:
    name: zhishiku
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/zhishiku}
    username: ${DATABASE_USERNAME:zhishiku}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never
  servlet:
    session:
      cookie:
        name: zhishiku_session
        path: /kb
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
    multipart:
      max-file-size: 26214400B
      max-request-size: 27262976B
  mail:
    host: ${SMTP_HOST:smtpdm.aliyun.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:no-reply@mail.seaunit.site}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${SMTP_SSL:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  owner:
    email: ${KB_OWNER_EMAIL:}
    password: ${KB_OWNER_PASSWORD:}
    bootstrap-token: ${KB_BOOTSTRAP_TOKEN:}
    auto-bootstrap: ${KB_AUTO_BOOTSTRAP:false}
  storage:
    root: ${KB_STORAGE_ROOT:.data/uploads}
  security:
    cookie-name: zhishiku_session
    cookie-path: /kb
  captcha:
    ttl-seconds: ${KB_CAPTCHA_TTL_SECONDS:120}
    max-entries: ${KB_CAPTCHA_MAX_ENTRIES:10000}
    expose-answer: ${KB_CAPTCHA_EXPOSE_ANSWER:false}
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
    code-ttl-seconds: ${REGISTRATION_CODE_TTL_SECONDS:600}
    resend-cooldown-seconds: ${REGISTRATION_RESEND_COOLDOWN_SECONDS:60}
    send-window-seconds: ${REGISTRATION_SEND_WINDOW_SECONDS:3600}
    max-sends-per-email: ${REGISTRATION_MAX_SENDS_PER_EMAIL:5}
    max-sends-per-ip: ${REGISTRATION_MAX_SENDS_PER_IP:20}
    max-attempts: ${REGISTRATION_MAX_ATTEMPTS:5}
    max-cached-codes: ${REGISTRATION_MAX_CACHED_CODES:10000}
    expose-code: ${REGISTRATION_EXPOSE_CODE:false}
    from-address: ${SMTP_FROM:no-reply@mail.seaunit.site}
    from-name: ${SMTP_FROM_NAME:识海}
  external-search:
    search-endpoint: ${DEEPSEEK_SEARCH_ENDPOINT:https://api.deepseek.com/v1/tools/search}
    fetch-endpoint: ${DEEPSEEK_FETCH_ENDPOINT:https://api.deepseek.com/v1/tools/fetch}
    search-api-key: ${DEEPSEEK_SEARCH_API_KEY:}
    fetch-api-key: ${DEEPSEEK_FETCH_API_KEY:}
    timeout-seconds: ${DEEPSEEK_SEARCH_TIMEOUT_SECONDS:20}
    max-results: ${DEEPSEEK_SEARCH_MAX_RESULTS:8}
    candidate-ttl-seconds: ${DEEPSEEK_SEARCH_CANDIDATE_TTL_SECONDS:900}
  ai:
    endpoint: ${DEEPSEEK_AI_ENDPOINT:https://api.deepseek.com/chat/completions}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout-seconds: ${DEEPSEEK_AI_TIMEOUT_SECONDS:35}
  web-import:
    allow-unbilled-ai: ${KB_WEB_IMPORT_ALLOW_UNBILLED_AI:false}
    worker-jar: ${KB_BROWSER_WORKER_JAR:/opt/zhishiku/current/kb-browser-worker.jar}
    tesseract-command: ${TESSERACT_COMMAND:tesseract}
    browser-timeout-seconds: ${KB_BROWSER_TIMEOUT_SECONDS:35}
    ocr-timeout-seconds: ${KB_OCR_TIMEOUT_SECONDS:30}
    max-text-chars: ${KB_WEB_IMPORT_MAX_TEXT_CHARS:30000}
    max-items: ${KB_WEB_IMPORT_MAX_ITEMS:20}
  document-import:
    max-text-chars: ${KB_DOCUMENT_IMPORT_MAX_TEXT_CHARS:60000}
    timeout-seconds: ${KB_DOCUMENT_IMPORT_TIMEOUT_SECONDS:25}
  screenshot-import:
    max-text-chars: ${KB_SCREENSHOT_IMPORT_MAX_TEXT_CHARS:30000}
  billing:
    environment: ${APP_ENV:test}
    database-environment: ${BILLING_DB_ENV:test}
    enabled: ${BILLING_ENABLED:false}
    bridge-url: ${BILLING_BRIDGE_URL:http://127.0.0.1:8091}
    app-to-bridge-secret: ${APP_TO_BRIDGE_SECRET:}
    bridge-to-app-secret: ${BRIDGE_TO_APP_SECRET:}
    catalog-version: ${BILLING_CATALOG_VERSION:2026-10-mvp}
    checkout-success-url: ${CHECKOUT_SUCCESS_URL:http://127.0.0.1:4173/kb/billing/return}
    webhook-url: ${BILLING_WEBHOOK_URL:http://127.0.0.1:8082/kb/api/internal/billing/waffo-events}
    refund-support-url: ${REFUND_SUPPORT_URL:https://support.example.invalid/refund}
    refund-response-target: ${REFUND_RESPONSE_TARGET:3 个工作日}
    admin-emails: ${BILLING_ADMIN_EMAILS:}
    idempotency-ttl-seconds: ${BILLING_IDEMPOTENCY_TTL_SECONDS:86400}
    task-ttl-seconds: ${BILLING_TASK_TTL_SECONDS:1800}
    trial-points: ${BILLING_TRIAL_POINTS:100}

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    site.seaunit.zhishiku: INFO
