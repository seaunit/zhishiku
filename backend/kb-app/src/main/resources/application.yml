server:
  port: ${SHIHAI_SERVER_PORT:${SERVER_PORT:8082}}
  servlet:
    context-path: /kb
  forward-headers-strategy: framework

spring:
  application:
    name: zhishiku
  datasource:
    url: ${SHIHAI_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/zhishiku}}
    username: ${SHIHAI_DATABASE_USERNAME:${DATABASE_USERNAME:zhishiku}}
    password: ${SHIHAI_DATABASE_PASSWORD:${DATABASE_PASSWORD:}}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never
  servlet:
    session:
      cookie:
        name: zhishiku_session
        path: /kb
        http-only: true
        same-site: lax
        secure: ${SHIHAI_SESSION_COOKIE_SECURE:${SESSION_COOKIE_SECURE:false}}
    multipart:
      max-file-size: 26214400B
      max-request-size: 27262976B
  mail:
    host: ${SHIHAI_SMTP_HOST:${SMTP_HOST:smtpdm.aliyun.com}}
    port: ${SHIHAI_SMTP_PORT:${SMTP_PORT:465}}
    username: ${SHIHAI_SMTP_USERNAME:${SMTP_USERNAME:no-reply@mail.seaunit.site}}
    password: ${SHIHAI_SMTP_PASSWORD:${SMTP_PASSWORD:}}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${SHIHAI_SMTP_SSL:${SMTP_SSL:true}}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  owner:
    email: ${SHIHAI_OWNER_EMAIL:${KB_OWNER_EMAIL:}}
    password: ${SHIHAI_OWNER_PASSWORD:${KB_OWNER_PASSWORD:}}
    bootstrap-token: ${SHIHAI_BOOTSTRAP_TOKEN:${KB_BOOTSTRAP_TOKEN:}}
    auto-bootstrap: ${SHIHAI_AUTO_BOOTSTRAP:${KB_AUTO_BOOTSTRAP:false}}
  storage:
    root: ${SHIHAI_STORAGE_ROOT:${KB_STORAGE_ROOT:.data/uploads}}
  security:
    cookie-name: zhishiku_session
    cookie-path: /kb
  captcha:
    ttl-seconds: ${SHIHAI_CAPTCHA_TTL_SECONDS:${KB_CAPTCHA_TTL_SECONDS:120}}
    max-entries: ${SHIHAI_CAPTCHA_MAX_ENTRIES:${KB_CAPTCHA_MAX_ENTRIES:10000}}
    expose-answer: ${SHIHAI_CAPTCHA_EXPOSE_ANSWER:${KB_CAPTCHA_EXPOSE_ANSWER:false}}
  registration:
    enabled: ${SHIHAI_REGISTRATION_ENABLED:${REGISTRATION_ENABLED:true}}
    code-ttl-seconds: ${SHIHAI_REGISTRATION_CODE_TTL_SECONDS:${REGISTRATION_CODE_TTL_SECONDS:600}}
    resend-cooldown-seconds: ${SHIHAI_REGISTRATION_RESEND_COOLDOWN_SECONDS:${REGISTRATION_RESEND_COOLDOWN_SECONDS:60}}
    send-window-seconds: ${SHIHAI_REGISTRATION_SEND_WINDOW_SECONDS:${REGISTRATION_SEND_WINDOW_SECONDS:3600}}
    max-sends-per-email: ${SHIHAI_REGISTRATION_MAX_SENDS_PER_EMAIL:${REGISTRATION_MAX_SENDS_PER_EMAIL:5}}
    max-sends-per-ip: ${SHIHAI_REGISTRATION_MAX_SENDS_PER_IP:${REGISTRATION_MAX_SENDS_PER_IP:20}}
    max-attempts: ${SHIHAI_REGISTRATION_MAX_ATTEMPTS:${REGISTRATION_MAX_ATTEMPTS:5}}
    max-cached-codes: ${SHIHAI_REGISTRATION_MAX_CACHED_CODES:${REGISTRATION_MAX_CACHED_CODES:10000}}
    expose-code: ${SHIHAI_REGISTRATION_EXPOSE_CODE:${REGISTRATION_EXPOSE_CODE:false}}
    from-address: ${SHIHAI_SMTP_FROM:${SMTP_FROM:no-reply@mail.seaunit.site}}
    from-name: ${SHIHAI_SMTP_FROM_NAME:${SMTP_FROM_NAME:识海}}
  external-search:
    search-endpoint: ${SHIHAI_DEEPSEEK_SEARCH_ENDPOINT:${DEEPSEEK_SEARCH_ENDPOINT:https://api.deepseek.com/v1/tools/search}}
    fetch-endpoint: ${SHIHAI_DEEPSEEK_FETCH_ENDPOINT:${DEEPSEEK_FETCH_ENDPOINT:https://api.deepseek.com/v1/tools/fetch}}
    search-api-key: ${SHIHAI_DEEPSEEK_SEARCH_API_KEY:${DEEPSEEK_SEARCH_API_KEY:}}
    fetch-api-key: ${SHIHAI_DEEPSEEK_FETCH_API_KEY:${DEEPSEEK_FETCH_API_KEY:}}
    timeout-seconds: ${SHIHAI_DEEPSEEK_SEARCH_TIMEOUT_SECONDS:${DEEPSEEK_SEARCH_TIMEOUT_SECONDS:20}}
    max-results: ${SHIHAI_DEEPSEEK_SEARCH_MAX_RESULTS:${DEEPSEEK_SEARCH_MAX_RESULTS:8}}
    candidate-ttl-seconds: ${SHIHAI_DEEPSEEK_SEARCH_CANDIDATE_TTL_SECONDS:${DEEPSEEK_SEARCH_CANDIDATE_TTL_SECONDS:900}}
  ai:
    endpoint: ${SHIHAI_DEEPSEEK_AI_ENDPOINT:${DEEPSEEK_AI_ENDPOINT:https://api.deepseek.com/chat/completions}}
    api-key: ${SHIHAI_DEEPSEEK_API_KEY:${DEEPSEEK_API_KEY:}}
    model: ${SHIHAI_DEEPSEEK_MODEL:${DEEPSEEK_MODEL:deepseek-chat}}
    timeout-seconds: ${SHIHAI_DEEPSEEK_AI_TIMEOUT_SECONDS:${DEEPSEEK_AI_TIMEOUT_SECONDS:35}}
  web-import:
    allow-unbilled-ai: ${SHIHAI_WEB_IMPORT_ALLOW_UNBILLED_AI:${KB_WEB_IMPORT_ALLOW_UNBILLED_AI:false}}
    worker-jar: ${SHIHAI_BROWSER_WORKER_JAR:${KB_BROWSER_WORKER_JAR:/opt/zhishiku/current/kb-browser-worker.jar}}
    tesseract-command: ${SHIHAI_TESSERACT_COMMAND:${TESSERACT_COMMAND:tesseract}}
    browser-timeout-seconds: ${SHIHAI_BROWSER_TIMEOUT_SECONDS:${KB_BROWSER_TIMEOUT_SECONDS:35}}
    ocr-timeout-seconds: ${SHIHAI_OCR_TIMEOUT_SECONDS:${KB_OCR_TIMEOUT_SECONDS:30}}
    max-text-chars: ${SHIHAI_WEB_IMPORT_MAX_TEXT_CHARS:${KB_WEB_IMPORT_MAX_TEXT_CHARS:30000}}
    max-items: ${SHIHAI_WEB_IMPORT_MAX_ITEMS:${KB_WEB_IMPORT_MAX_ITEMS:20}}
  admin:
    username: ${SHIHAI_ADMIN_USERNAME:a115846}
    password: ${SHIHAI_ADMIN_PASSWORD:}
  document-import:
    max-text-chars: ${SHIHAI_DOCUMENT_IMPORT_MAX_TEXT_CHARS:${KB_DOCUMENT_IMPORT_MAX_TEXT_CHARS:60000}}
    timeout-seconds: ${SHIHAI_DOCUMENT_IMPORT_TIMEOUT_SECONDS:${KB_DOCUMENT_IMPORT_TIMEOUT_SECONDS:25}}
  screenshot-import:
    max-text-chars: ${SHIHAI_SCREENSHOT_IMPORT_MAX_TEXT_CHARS:${KB_SCREENSHOT_IMPORT_MAX_TEXT_CHARS:30000}}
  billing:
    environment: ${SHIHAI_APP_ENV:${APP_ENV:test}}
    database-environment: ${SHIHAI_BILLING_DB_ENV:${BILLING_DB_ENV:test}}
    enabled: ${SHIHAI_BILLING_ENABLED:${BILLING_ENABLED:false}}
    bridge-url: ${SHIHAI_BILLING_BRIDGE_URL:${BILLING_BRIDGE_URL:http://127.0.0.1:8091}}
    app-to-bridge-secret: ${SHIHAI_APP_TO_BRIDGE_SECRET:${APP_TO_BRIDGE_SECRET:}}
    bridge-to-app-secret: ${SHIHAI_BRIDGE_TO_APP_SECRET:${BRIDGE_TO_APP_SECRET:}}
    catalog-version: ${SHIHAI_BILLING_CATALOG_VERSION:${BILLING_CATALOG_VERSION:2026-10-mvp}}
    checkout-success-url: ${SHIHAI_CHECKOUT_SUCCESS_URL:${CHECKOUT_SUCCESS_URL:http://127.0.0.1:4173/kb/billing/return}}
    webhook-url: ${SHIHAI_BILLING_WEBHOOK_URL:${BILLING_WEBHOOK_URL:http://127.0.0.1:8082/kb/api/internal/billing/waffo-events}}
    refund-support-url: ${SHIHAI_REFUND_SUPPORT_URL:${REFUND_SUPPORT_URL:https://support.example.invalid/refund}}
    refund-response-target: ${SHIHAI_REFUND_RESPONSE_TARGET:${REFUND_RESPONSE_TARGET:3 个工作日}}
    admin-emails: ${SHIHAI_BILLING_ADMIN_EMAILS:${BILLING_ADMIN_EMAILS:}}
    idempotency-ttl-seconds: ${SHIHAI_BILLING_IDEMPOTENCY_TTL_SECONDS:${BILLING_IDEMPOTENCY_TTL_SECONDS:86400}}
    task-ttl-seconds: ${SHIHAI_BILLING_TASK_TTL_SECONDS:${BILLING_TASK_TTL_SECONDS:1800}}
    trial-points: ${SHIHAI_BILLING_TRIAL_POINTS:${BILLING_TRIAL_POINTS:100}}

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    site.seaunit.zhishiku: INFO
