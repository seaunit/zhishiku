spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/zhishiku}
    username: ${DATABASE_USERNAME:zhishiku}
    password: ${DATABASE_PASSWORD:}

app:
  owner:
    email: ${KB_OWNER_EMAIL:owner@zhishiku.local}
    password: ${KB_OWNER_PASSWORD:local-dev-password-change-me}
    bootstrap-token: ${KB_BOOTSTRAP_TOKEN:local-bootstrap-token-change-me}
    auto-bootstrap: ${KB_AUTO_BOOTSTRAP:true}
  storage:
    root: ${KB_STORAGE_ROOT:.data/uploads}
  captcha:
    ttl-seconds: 120
    max-entries: 1000
    expose-answer: true
  registration:
    code-ttl-seconds: 600
    resend-cooldown-seconds: 60
    send-window-seconds: 3600
    max-sends-per-email: 5
    max-sends-per-ip: 20
    max-attempts: 5
    max-cached-codes: 1000
    expose-code: true
    from-address: no-reply@mail.seaunit.site
    from-name: 识海

logging:
  level:
    site.seaunit.zhishiku: DEBUG

management:
  health:
    mail:
      enabled: false
