spring:
  datasource:
    url: ${SHIHAI_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/zhishiku}}
    username: ${SHIHAI_DATABASE_USERNAME:${DATABASE_USERNAME:zhishiku}}
    password: ${SHIHAI_DATABASE_PASSWORD:${DATABASE_PASSWORD:}}

app:
  ai-orchestration:
    provider: ${SHIHAI_AI_ORCHESTRATION_PROVIDER:dify}
    dify-base-url: ${SHIHAI_DIFY_BASE_URL:http://127.0.0.1:8502/v1}
  owner:
    email: ${SHIHAI_OWNER_EMAIL:${KB_OWNER_EMAIL:owner@zhishiku.local}}
    password: ${SHIHAI_OWNER_PASSWORD:${KB_OWNER_PASSWORD:local-dev-password-change-me}}
    bootstrap-token: ${SHIHAI_BOOTSTRAP_TOKEN:${KB_BOOTSTRAP_TOKEN:local-bootstrap-token-change-me}}
    auto-bootstrap: ${SHIHAI_AUTO_BOOTSTRAP:${KB_AUTO_BOOTSTRAP:true}}
  storage:
    root: ${SHIHAI_STORAGE_ROOT:${KB_STORAGE_ROOT:.data/uploads}}
  captcha:
    ttl-seconds: 120
    max-entries: 1000
    expose-answer: true
  registration:
    enabled: true
    code-ttl-seconds: 600
    resend-cooldown-seconds: 60
    send-window-seconds: 3600
    max-sends-per-email: 5
    max-sends-per-ip: 20
    max-attempts: 5
    max-cached-codes: 1000
    expose-code: true
    from-address: no-reply@mail.seaunit.site
    from-name: 识海
  admin:
    username: ${SHIHAI_ADMIN_USERNAME:a115846}
    password: ${SHIHAI_ADMIN_PASSWORD:}

logging:
  level:
    site.seaunit.zhishiku: DEBUG

management:
  health:
    mail:
      enabled: false
