openapi: 3.1.0
info:
  title: 识海 AI 点数计费 API
  version: 1.0.0
  description: >
    单所有者识海应用的计费公开契约。服务端是套餐价格、AI 点率、报价、余额、订单和退款的
    唯一权威。客户端只能提交目录标识、数量和幂等键，不能提交权威金额或点数。
servers:
  - url: http://127.0.0.1:8082/kb
    description: 使用生产兼容 /kb 基础路径的本地接口
security:
  - sessionCookie: []
x-csrf:
  requiredFor: [POST, PATCH, DELETE]
  header: X-XSRF-TOKEN
tags:
  - name: 计费目录
  - name: 点数账户
  - name: 订单与支付
  - name: AI 报价
  - name: 自动扣点
  - name: 退款
  - name: 管理员计费
  - name: 内部事件
paths:
  /api/v1/billing/catalog:
    get:
      tags: [计费目录]
      operationId: getBillingCatalog
      summary: 获取当前环境的三档一次性点数包与 AI 点率。
      responses:
        "200":
          description: 当前有效目录版本。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/billing/account:
    get:
      tags: [点数账户]
      operationId: getCreditAccount
      summary: 获取当前可用、预留、体验点和购买点余额。
      responses:
        "200":
          description: 当前点数账户投影。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/billing/ledger:
    get:
      tags: [点数账户]
      operationId: listCreditLedger
      summary: 按时间倒序查询不可变点数明细。
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: operationType
          in: query
          schema:
            $ref: "#/components/schemas/LedgerOperationType"
      responses:
        "200":
          description: 点数明细页。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/billing/orders:
    get:
      tags: [订单与支付]
      operationId: listBillingOrders
      summary: 查询当前所有者的点数包订单。
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 订单页。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [订单与支付]
      operationId: createBillingOrder
      summary: 基于当前目录创建或恢复待支付订单。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: 已创建订单。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "200":
          description: 幂等请求返回已有订单，或复用有效待支付订单。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/billing/orders/{orderId}:
    get:
      tags: [订单与支付]
      operationId: getBillingOrder
      summary: 查询订单状态；返回页不触发到账。
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: 当前订单状态。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/billing/orders/{orderId}/checkout:
    post:
      tags: [订单与支付]
      operationId: openBillingCheckout
      summary: 创建或恢复该订单唯一有效的 Waffo 收银台会话。
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 可用收银台会话。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/billing/auto-charge:
    get:
      tags: [自动扣点]
      operationId: getAutoChargePolicy
      summary: 获取独立的自动整理扣点授权和限额。
      responses:
        "200":
          description: 当前自动扣点设置。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoChargePolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [自动扣点]
      operationId: updateAutoChargePolicy
      summary: 开启、关闭或调整自动整理扣点上限。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutoChargePolicyRequest"
      responses:
        "200":
          description: 已更新并保留授权历史。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoChargePolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/billing/preflights:
    post:
      tags: [AI 报价]
      operationId: createBillingPreflight
      summary: 免费预检文档字符或网页视图上限并返回短期 preflightId。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePreflightRequest"
      responses:
        "201":
          description: 已生成服务端认可的报价依据。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPreflight"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: 文件或页面视图超过已批准上限。
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/billing/quotes:
    post:
      tags: [AI 报价]
      operationId: createBillingQuote
      summary: 根据服务端目录生成组合 AI 任务费用上限。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteRequest"
      responses:
        "201":
          description: 已生成有有效期的分项报价。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingQuote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/billing/quotes/{quoteId}/confirm:
    post:
      tags: [AI 报价]
      operationId: confirmBillingQuote
      summary: 确认费用上限并为 AI 任务原子预留点数。
      parameters:
        - $ref: "#/components/parameters/QuoteId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmQuoteRequest"
      responses:
        "200":
          description: 任务已预留，可交给现有 AI 执行链路。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/billing/tasks/{taskId}:
    get:
      tags: [AI 报价]
      operationId: getBillingTask
      summary: 查询报价、全部预留、分步骤结算和最终状态。
      parameters:
        - $ref: "#/components/parameters/BillingTaskId"
      responses:
        "200":
          description: 计费任务详情。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/billing/tasks/{taskId}/cancel:
    post:
      tags: [AI 报价]
      operationId: cancelBillingTask
      summary: 取消未开始任务并释放预留；已开始任务按取消结果结算。
      parameters:
        - $ref: "#/components/parameters/BillingTaskId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: 已接受取消。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/billing/refunds:
    get:
      tags: [退款]
      operationId: listRefundCases
      summary: 查询退款处理状态和最终结论。
      responses:
        "200":
          description: 退款案例列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RefundCase"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/billing/refunds/{refundId}:
    get:
      tags: [退款]
      operationId: getRefundCase
      summary: 查询单项退款、回收点数和人工复核期限。
      parameters:
        - name: refundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 退款案例。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundCase"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/billing/summary:
    get:
      tags: [管理员计费]
      operationId: getAdminBillingSummary
      summary: 按日期、订单、状态和套餐汇总财务与点数事实。
      security:
        - adminSessionCookie: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 脱敏财务汇总。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/admin/billing/refunds/{refundId}/resolve:
    post:
      tags: [管理员计费]
      operationId: resolveAdminRefundCase
      summary: 由授权管理员记录退款最终结论和未回收点数。
      security:
        - adminSessionCookie: []
      parameters:
        - name: refundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundResolutionRequest"
      responses:
        "200":
          description: 已形成最终退款结论。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundCase"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/admin/billing/adjustments:
    post:
      tags: [管理员计费]
      operationId: createAdminCreditAdjustment
      summary: 通过只追加账本进行受控人工点数调整。
      security:
        - adminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualAdjustmentRequest"
      responses:
        "201":
          description: 已追加账本并保留审计事实。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/internal/billing/waffo-events:
    post:
      tags: [内部事件]
      operationId: ingestNormalizedWaffoEvent
      summary: 桥接向识海转发已验签的安全化支付事件。
      security:
        - internalSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NormalizedWaffoEvent"
      responses:
        "200":
          description: 事件已应用或识别为重复。
        "400":
          description: 事件结构无效。
        "401":
          description: 内部服务认证失败。
        "409":
          description: 事件与本地订单事实冲突，已进入人工复核。
        "500":
          description: 临时处理失败，允许桥接安全重试。
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: zhishiku_session
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: zhishiku_session
      description: 必须同时具有受控管理员角色；普通会话返回 403。
    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuoteId:
      name: quoteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BillingTaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: 需要身份认证。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 缺少隐私授权、自动扣点授权或所需权限。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在或不属于当前所有者。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 状态冲突、幂等键复用冲突或报价已过期。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: 请求验证失败且不回显敏感内容。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaymentRequired:
      description: 点数不足，任务未启动且未扣费。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InsufficientPointsError"
    ServiceUnavailable:
      description: 支付目录或桥接暂时不可用；现有余额不变。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Environment:
      type: string
      enum: [test, production]
    OrderStatus:
      type: string
      enum: [PENDING, CONFIRMING, PAID, CLOSED, REFUNDING, REFUNDED, EXCEPTION]
    BillingTaskStatus:
      type: string
      enum:
        - QUOTED
        - CONFIRMED
        - RESERVED
        - RUNNING
        - SETTLED
        - RELEASED
        - INSUFFICIENT
        - EXPIRED
        - CANCELLED
        - MANUAL_REVIEW
    LedgerOperationType:
      type: string
      enum:
        - trial_grant
        - purchase_grant
        - reserve
        - reserve_release
        - settle
        - refund_recover
        - manual_adjustment
    BillingFeature:
      type: string
      enum:
        - classify
        - webpage_vision
        - document_extract
        - screenshot_ocr
        - internet_search
        - ai_answer
    BillingUnit:
      type: string
      enum: [entry, view, per_10k_chars, image, query, answer]
    ErrorResponse:
      type: object
      required: [code, message, requestId, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    InsufficientPointsError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [requiredPoints, availablePoints, shortfallPoints]
          properties:
            code:
              const: INSUFFICIENT_POINTS
            requiredPoints:
              type: integer
              minimum: 1
            availablePoints:
              type: integer
              minimum: 0
            shortfallPoints:
              type: integer
              minimum: 1
    BillingCatalog:
      type: object
      required: [environment, versionCode, packs, aiRates, refundPolicy]
      properties:
        environment:
          $ref: "#/components/schemas/Environment"
        versionCode:
          type: string
        packs:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/PointPack"
        aiRates:
          type: array
          minItems: 6
          items:
            $ref: "#/components/schemas/AIRate"
        refundPolicy:
          $ref: "#/components/schemas/RefundPolicy"
    PointPack:
      type: object
      required: [sku, name, priceMinor, currency, points, oneTime]
      properties:
        sku:
          type: string
          enum: [kb_pack_9, kb_pack_29, kb_pack_99]
        name:
          type: string
        priceMinor:
          type: integer
          enum: [900, 2900, 9900]
        currency:
          type: string
          const: CNY
        points:
          type: integer
          enum: [400, 1400, 5000]
        oneTime:
          type: boolean
          const: true
    AIRate:
      type: object
      required: [feature, unit, pointsPerUnit, description]
      properties:
        feature:
          $ref: "#/components/schemas/BillingFeature"
        unit:
          $ref: "#/components/schemas/BillingUnit"
        pointsPerUnit:
          type: integer
          minimum: 1
        description:
          type: string
    RefundPolicy:
      type: object
      required: [summary, supportChannel, responseTarget, pointsTransferable]
      properties:
        summary:
          type: string
        supportChannel:
          type: string
        responseTarget:
          type: string
          const: 3 个工作日
        pointsTransferable:
          type: boolean
          const: false
    CreditAccount:
      type: object
      required: [availablePoints, reservedPoints, trialPoints, purchasedPoints, updatedAt]
      properties:
        availablePoints:
          type: integer
          minimum: 0
        reservedPoints:
          type: integer
          minimum: 0
        trialPoints:
          type: integer
          minimum: 0
        purchasedPoints:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
    LedgerEntry:
      type: object
      required:
        - id
        - operationType
        - availableDelta
        - reservedDelta
        - consumedDelta
        - availableAfter
        - createdAt
      properties:
        id:
          type: string
        operationType:
          $ref: "#/components/schemas/LedgerOperationType"
        availableDelta:
          type: integer
        reservedDelta:
          type: integer
        consumedDelta:
          type: integer
        availableAfter:
          type: integer
          minimum: 0
        reservedAfter:
          type: integer
          minimum: 0
        referenceType:
          type: string
        referenceId:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    LedgerPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"
        nextCursor:
          type:
            - string
            - "null"
    CreateOrderRequest:
      type: object
      required: [sku]
      properties:
        sku:
          type: string
          enum: [kb_pack_9, kb_pack_29, kb_pack_99]
    PaymentOrder:
      type: object
      required:
        - id
        - sku
        - environment
        - amountMinor
        - currency
        - points
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        environment:
          $ref: "#/components/schemas/Environment"
        amountMinor:
          type: integer
          minimum: 1
        currency:
          type: string
