openapi: 3.1.0
info:
  title: 识海一键全部复核 API
  version: 1.0.0
paths:
  /knowledge-items/review-all:
    post:
      summary: 复核当前账号全部待复核知识
      description: 只处理当前认证账号中 active 且 processingStatus 为 review 的知识。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 批量复核完成
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reviewed]
                properties:
                  reviewed:
                    type: integer
                    minimum: 0
        "401":
          description: 未登录
        "403":
          description: CSRF 校验失败
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: zhishiku_session
