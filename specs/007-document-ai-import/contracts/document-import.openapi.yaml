openapi: 3.1.0
info:
  title: 识海文档解析与 AI 拆分 API
  version: 1.0.0
servers:
  - url: /kb
security:
  - sessionCookie: []
paths:
  /api/v1/document-imports:
    post:
      operationId: importDocument
      summary: 解析一个文档并用 AI 拆分为多条知识
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
          description: 客户端重试关联键；当前不承诺服务端自动去重，幂等增强属于 P2。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, externalAiConsent]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    PDF、DOC、DOCX、RTF、TXT、Markdown、JPG、PNG 或 WebP；最大 25 MiB。
                    图片必须经过安全检查、方向规范化和 OCR，不得直接作为附件保存。
                externalAiConsent:
                  type: boolean
                  const: true
                note:
                  type: string
                  maxLength: 20000
      responses:
        "201":
          description: 文档已解析并创建一条或多条知识。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentImportResponse"
        "402":
          description: 生产点数门禁未满足。
        "413":
          description: 文件超过 25 MiB。
        "415":
          description: 文件内容不是受支持文档或图片。
        "422":
          description: 同意缺失、无文字、文本超长、解析失败或 AI 整理失败。
        "503":
          description: 解析器或 AI 服务不可用。
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: zhishiku_session
  schemas:
    DocumentImportResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/KnowledgeItem"
    KnowledgeItem:
      type: object
      required: [id, title, body, bodyDocument, source, processingStatus]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        bodyDocument:
          type: object
        source:
          type: object
          required: [kind, capturedAt]
          properties:
            kind:
              const: document
            url:
              type: "null"
            capturedAt:
              type: string
              format: date-time
        processingStatus:
          const: succeeded
