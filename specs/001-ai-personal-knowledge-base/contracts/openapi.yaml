openapi: 3.1.0
info:
  title: Zhishiku 个人知识 API
  version: 1.0.0
  description: >
    面向单一所有者 AI 个人知识库的内部 HTTP 契约。
    权威数据存储为私有资源；互联网搜索和 AI 调用需要用户显式操作并提供匹配的授权。
    付费 AI 还必须引用 002 计费契约中的有效报价/计费任务；余额不足返回 402 且不启动 AI。
servers:
  - url: http://localhost:3000/kb
    description: 使用与生产环境兼容的 /kb 基础路径的本地实现
security:
  - sessionCookie: []
tags:
  - name: 搜索
  - name: 知识
  - name: 导入
  - name: 任务
  - name: 授权
  - name: 计费集成
  - name: 回收站
  - name: 健康检查
paths:
  /health:
    get:
      tags: [健康检查]
      security: []
      operationId: getHealth
      summary: 检查知识库及可选计费能力。
      responses:
        "200":
          description: 服务健康状态和功能可用性。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/search:
    get:
      tags: [搜索]
      operationId: searchPersonalKnowledge
      summary: 使用单个查询字符串搜索个人知识库。
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 300
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 仅返回个人知识结果。互联网搜索需通过单独调用完成。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/search/external:
    post:
      tags: [搜索]
      operationId: searchInternet
      summary: 仅将查询发送给已授权的互联网搜索提供商。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/BillingTaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalSearchRequest"
      responses:
        "200":
          description: 短期互联网搜索候选结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalSearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/search/external/{candidateId}/save:
    post:
      tags: [搜索, 知识]
      operationId: saveExternalCandidate
      summary: 将已确认的互联网候选保存为知识条目。
      parameters:
        - $ref: "#/components/parameters/CandidateId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveExternalCandidateRequest"
      responses:
        "201":
          description: 已基于该候选创建 active 知识条目；计费不可用时仍保存并标记待整理，不返回 402。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: 短期候选结果已过期。
  /api/v1/knowledge-items:
    get:
      tags: [知识]
      operationId: listKnowledgeItems
      summary: 分页列出 active 知识条目。
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProcessingStatus"
        - name: source
          in: query
          schema:
            $ref: "#/components/schemas/SourceKind"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: active 知识条目。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItemPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [知识]
      operationId: createKnowledgeItem
      summary: 创建可立即搜索的 active 手动条目。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeItemRequest"
      responses:
        "201":
          description: 条目已创建。计费不可用或余额不足时仍保存并标记待整理，不返回 402。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/knowledge-items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [知识]
      operationId: getKnowledgeItem
      summary: 获取单个 active 知识条目。
      responses:
        "200":
          description: 完整的 active 条目。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [知识]
      operationId: updateKnowledgeItem
      summary: 更新知识条目并执行版本冲突检查。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKnowledgeItemRequest"
      responses:
        "200":
          description: 已更新的条目。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [知识, 回收站]
      operationId: moveKnowledgeItemToTrash
      summary: 将知识条目移入回收站并立即移出检索。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: 条目不再处于 active 状态，且不可搜索。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/knowledge-items/{itemId}/classifications:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    patch:
      tags: [知识]
      operationId: updateClassifications
      summary: 修正分类；编辑后的条目字段将变为锁定状态。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassificationsRequest"
      responses:
        "200":
          description: 返回已锁定的分配。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/knowledge-items/{itemId}/reanalyze:
    post:
      tags: [知识, 任务]
      operationId: reanalyzeKnowledgeItem
      summary: 使用新计费任务重新分析知识条目。
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/BillingTaskId"
      responses:
        "202":
          description: 已接受重新分析请求。可能需要新的授权。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/imports/text:
    post:
      tags: [导入]
      operationId: importText
      summary: 导入文本并创建可立即检索的条目。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextImportRequest"
      responses:
        "202":
          description: 已接受 active 条目和后台任务；付费 AI 不可用时仍保存内容并标记待整理。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/imports/webpage:
    post:
      tags: [导入]
      operationId: importWebpage
      summary: 采集用户明确提交的单个网页截图并创建条目。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebpageImportRequest"
      responses:
        "202":
          description: 已接受 active 条目和单页采集任务；计费不可用时仍保存 URL 并标记待整理。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/imports/upload:
    post:
      tags: [导入]
      operationId: uploadKnowledgeAttachment
      summary: 安全扫描并导入文档或截图。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                sourceType:
                  type: string
                  enum: [document, screenshot]
                note:
                  type: string
                  maxLength: 20000
                billingTaskId:
                  type: string
                  format: uuid
                  description: 付费文档提取或 OCR 的有效计费任务；缺失时只保存并等待整理。
      responses:
        "202":
          description: 仅在完整安全扫描通过后接受上传；计费不可用时仍保存并通过状态等待付费 AI。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: 文件超过配置的上传限制。
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/jobs/{jobId}:
    get:
      tags: [任务]
      operationId: getJob
      summary: 查询任务状态和安全错误。
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 当前任务状态。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/jobs/{jobId}/retry:
    post:
      tags: [任务]
      operationId: retryJob
      summary: 使用新的计费上下文重试可恢复任务。
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: 已接受重试请求。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/jobs/{jobId}/cancel:
    post:
      tags: [任务]
      operationId: cancelJob
      summary: 取消任务并释放未消费计费预留。
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: 已接受取消请求。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/ai-authorizations:
    get:
      tags: [授权]
      operationId: listAIAuthorizations
      summary: 列出 active 与历史 AI 外发授权。
      responses:
        "200":
          description: active 和已撤销的授权历史。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AIAuthorization"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [授权]
      operationId: grantAIAuthorization
      summary: 为指定服务和内容类型授予隐私授权。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIAuthorizationRequest"
      responses:
        "201":
          description: 已为单个服务和内容类型授予授权。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIAuthorization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/ai-authorizations/{authorizationId}:
    delete:
      tags: [授权]
      operationId: revokeAIAuthorization
      summary: 撤销指定范围未来的 AI 外发授权。
      parameters:
        - name: authorizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: 此范围内后续传输已被禁用。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/trash:
    get:
      tags: [回收站]
      operationId: listTrash
      summary: 分页列出回收站条目。
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 仅返回 recycled 状态的条目。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItemPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/trash/{itemId}/restore:
    post:
      tags: [回收站]
      operationId: restoreKnowledgeItem
      summary: 恢复回收站中的知识条目。
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 已恢复的 active 条目。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/trash/{itemId}:
    delete:
      tags: [回收站]
      operationId: permanentlyDeleteKnowledgeItem
      summary: 永久清除知识条目及关联内容。
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: 已接受永久清除请求，且该操作具有幂等性。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BillingTaskId:
      name: Billing-Task-Id
      in: header
      required: false
      description: 002 计费任务标识；缺失时不得执行付费 AI，但内容仍可保存为待整理。
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: 需要身份认证。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 缺少所需的授权范围。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在，或不属于当前所有者。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 版本冲突或幂等键重复。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: 请求验证失败，且未回显敏感内容。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: 已达到提供商或本地速率限制。
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaymentRequired:
      description: 纯付费执行点数不足且尚未保存内容；保存类接口不返回 402，报价过期返回 409，缺少计费任务保存为待整理。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InsufficientPointsError"
  schemas:
    ProcessingStatus:
      type: string
      enum:
        - not_requested
        - awaiting_authorization
        - blocked_billing
        - pending
        - running
        - partial
        - succeeded
        - failed
        - cancelled
    LifecycleState:
      type: string
      enum: [active, recycled, purging]
    SourceKind:
      type: string
      enum: [manual, pasted_text, webpage, document, screenshot, internet_search]
    ContentType:
      type: string
      enum: [text, document, image, webpage, internet_result]
    ClassificationStatus:
      type: string
      enum: [provisional, applied, locked, superseded]
    ClassificationOrigin:
      type: string
      enum: [ai, user, system]
    HealthResponse:
      type: object
      required: [status, features]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        features:
          type: object
          additionalProperties:
            type: string
            enum: [available, unavailable, degraded]
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    InsufficientPointsError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [requiredPoints, availablePoints, shortfallPoints]
          properties:
            code:
              const: INSUFFICIENT_POINTS
            requiredPoints:
              type: integer
              minimum: 1
            availablePoints:
              type: integer
              minimum: 0
            shortfallPoints:
              type: integer
              minimum: 1
    BillingTaskSummary:
      type: object
      required: [billingTaskId, status, maxPoints, settledPoints]
      properties:
        billingTaskId:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUOTED, CONFIRMED, RESERVED, RUNNING, SETTLED, RELEASED, INSUFFICIENT, EXPIRED, CANCELLED, MANUAL_REVIEW]
        maxPoints:
          type: integer
          minimum: 1
        settledPoints:
          type: integer
          minimum: 0
        balanceAfter:
          type: integer
          minimum: 0
    Source:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/SourceKind"
        url:
          type:
            - string
            - "null"
          format: uri
        provider:
          type:
            - string
            - "null"
        capturedAt:
          type:
            - string
            - "null"
          format: date-time
    ClassificationAssignment:
      type: object
      required: [id, name, status, origin]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: "#/components/schemas/ClassificationStatus"
        origin:
          $ref: "#/components/schemas/ClassificationOrigin"
        confidence:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1
        lockedAt:
          type:
            - string
            - "null"
          format: date-time
    AttachmentSummary:
      type: object
      required: [id, kind, mediaType, scanState, redactionState]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [document, image, screenshot, derived_redacted_image]
        mediaType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        scanState:
          type: string
          enum: [pending, clean, rejected]
        redactionState:
          type: string
          enum: [none, redacted, not_required, rejected]
    KnowledgeItem:
      type: object
      required:
        - id
        - title
        - body
        - note
        - processingStatus
        - lifecycleState
        - redactionApplied
        - source
        - category
        - tags
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        note:
          type: string
        summary:
          type:
            - string
            - "null"
        processingStatus:
          $ref: "#/components/schemas/ProcessingStatus"
        lifecycleState:
          $ref: "#/components/schemas/LifecycleState"
        processingErrorCode:
          type:
            - string
            - "null"
        redactionApplied:
          type: boolean
        source:
          $ref: "#/components/schemas/Source"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentSummary"
        category:
          oneOf:
            - $ref: "#/components/schemas/ClassificationAssignment"
            - type: "null"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/ClassificationAssignment"
        purgeAfter:
          type:
            - string
            - "null"
          format: date-time
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    KnowledgeItemPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeItem"
        nextCursor:
          type:
            - string
            - "null"
    CreateKnowledgeItemRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        body:
          type: string
          maxLength: 200000
        note:
          type: string
          maxLength: 20000
        sourceUrl:
          type:
            - string
            - "null"
          format: uri
        billingTaskId:
          type: string
          format: uuid
          description: 可选的自动整理计费任务；缺失时只保存并标记待整理。
    UpdateKnowledgeItemRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 300
        body:
          type: string
          maxLength: 200000
        note:
          type: string
          maxLength: 20000
        sourceUrl:
          type:
            - string
            - "null"
          format: uri
    UpdateClassificationsRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        categoryName:
          type:
            - string
            - "null"
          maxLength: 120
        tagNames:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 80
      description: 每个提交的分类字段都会成为用户锁定的分配。
    ClassificationResponse:
      type: object
      required: [itemId, category, tags, version]
      properties:
        itemId:
          type: string
          format: uuid
        category:
          oneOf:
            - $ref: "#/components/schemas/ClassificationAssignment"
            - type: "null"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/ClassificationAssignment"
        version:
          type: integer
    SearchHit:
      type: object
      required: [item, matchedFields, highlights]
      properties:
        item:
          $ref: "#/components/schemas/KnowledgeItem"
        matchedFields:
          type: array
          items:
            type: string
            enum: [title, body, note, category, tag]
        highlights:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    SearchResponse:
      type: object
      required: [items, nextCursor, degraded]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        nextCursor:
          type:
            - string
            - "null"
        degraded:
          type: boolean
          description: 当请求由有界 PostgreSQL 回退方案处理时为 true。
    ExternalSearchRequest:
      type: object
      required: [query, explicitConsent]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 300
        explicitConsent:
          type: boolean
          const: true
        includeAnswer:
          type: boolean
          default: false
          description: false 为 3 点搜索；true 为搜索 3 点加单次回答 2 点。
    ExternalSearchCandidate:
      type: object
      required: [candidateId, title, url, snippet, provider]
      properties:
        candidateId:
          type: string
          format: uuid
        title:
          type: string
        url:
          type: string
          format: uri
        snippet:
          type: string
        provider:
          type: string
        expiresAt:
          type: string
          format: date-time
    ExternalSearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExternalSearchCandidate"
        answer:
          type:
            - string
            - "null"
          description: includeAnswer=true 且回答成功时的单次回答；无依据或失败时为空。
        billing:
          oneOf:
            - $ref: "#/components/schemas/BillingTaskSummary"
            - type: "null"
    SaveExternalCandidateRequest:
      type: object
      properties:
        billingTaskId:
          type: string
          format: uuid
          description: 可选自动整理计费任务；缺失时保存为待整理。
    AIAuthorizationRequest:
      type: object
      required: [serviceCode, contentType, purpose, consentTextVersion]
      properties:
        serviceCode:
          type: string
          enum:
            - deepseek-classification
            - deepseek-search
            - deepseek-fetch
            - deepseek-vision
        contentType:
          $ref: "#/components/schemas/ContentType"
        purpose:
          type: string
          enum: [classify, search, fetch, vision]
        consentTextVersion:
          type: string
    AIAuthorization:
      type: object
      required:
        - id
        - serviceCode
        - contentType
        - purpose
        - grantedAt
      properties:
        id:
          type: string
          format: uuid
        serviceCode:
          type: string
        contentType:
          $ref: "#/components/schemas/ContentType"
        purpose:
          type: string
        consentTextVersion:
          type: string
        grantedAt:
          type: string
          format: date-time
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
    TextImportRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200000
        note:
          type: string
          maxLength: 20000
        billingTaskId:
          type: string
          format: uuid
          description: 可选自动整理计费任务；缺失时不执行付费 AI。
    WebpageImportRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        note:
          type: string
          maxLength: 20000
        billingTaskId:
          type: string
          format: uuid
          description: 单页截图分析和后续整理的有效计费任务；缺失时保存并等待整理。
