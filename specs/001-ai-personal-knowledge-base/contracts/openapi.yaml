openapi: 3.1.0
info:
  title: Zhishiku 个人知识 API
  version: 1.0.0
  description: >
    面向多账号隔离式 AI 个人知识库的内部 HTTP 契约。每个账号只访问自己的知识、
    附件、搜索、会话和 AI 授权；兼容字段 ownerId 的语义是当前账号 ID。
    权威数据存储为私有资源；互联网搜索和 AI 调用需要用户显式操作并提供匹配的授权。
    纯互联网搜索固定 1 点，入口点击即视为本次扣费同意；客户端自动创建并确认报价后调用，
    不增加搜索二次确认。
    付费 AI 还必须引用 002 计费契约中的有效报价/计费任务；余额不足返回 402 且不启动 AI。
servers:
  - url: http://127.0.0.1:8082/kb
    description: 使用与生产环境兼容的 /kb 基础路径的本地实现
security:
  - sessionCookie: []
x-csrf:
  requiredFor: [POST, PATCH, DELETE]
  header: X-XSRF-TOKEN
  description: Spring Security 对所有不安全方法要求会话绑定 CSRF；缺失或无效返回 403。
tags:
  - name: 认证
  - name: 搜索
  - name: 知识
  - name: 导入
  - name: 任务
  - name: 授权
  - name: 计费集成
  - name: 回收站
  - name: 健康检查
paths:
  /api/v1/auth/csrf:
    get:
      tags: [认证]
      security: []
      operationId: getCsrfToken
      summary: 获取匿名或已登录会话的 CSRF token。
      responses:
        "200":
          description: CSRF token 和请求头名称。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
  /api/v1/auth/captcha:
    get:
      tags: [认证]
      security: []
      operationId: getLoginCaptcha
      summary: 获取一次性登录图形验证码。
      description: >
        验证码答案只保存在服务端有界内存缓存中，默认 2 分钟过期，登录尝试后立即失效。
        生产响应绝不包含答案；仅本地开发配置可返回 debugAnswer 供自动化测试使用。
      responses:
        "200":
          description: 验证码 ID、PNG data URL 和有效期。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptchaResponse"
  /api/v1/auth/registration-status:
    get:
      tags: [认证]
      security: []
      operationId: getRegistrationStatus
      summary: 查询公开账号注册是否启用。
      responses:
        "200":
          description: 注册开关状态。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStatusResponse"
  /api/v1/auth/register/email-code:
    post:
      tags: [认证]
      security: []
      operationId: sendRegistrationEmailCode
      summary: 向常用邮箱发送一次性注册验证码，不要求图形验证码。
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationEmailCodeRequest"
      responses:
        "202":
          description: 邮件已发送；验证码本身只存在于邮件和短期哈希缓存中。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationEmailCodeResponse"
        "409":
          description: 邮箱已注册，或注册功能被明确关闭。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 邮箱格式或临时邮箱域名不符合要求。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: 发送过于频繁。
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: SMTP 暂时不可用，未生成有效邮箱验证码。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/register:
    post:
      tags: [认证]
      security: []
      operationId: registerAccount
      summary: 使用邮箱验证码和确认密码创建独立账号。
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 账号已创建；客户端随后进入登录页。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "409":
          description: 邮箱已注册，或注册功能被明确关闭。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 密码确认、邮箱验证码或输入字段无效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: 注册请求过于频繁。
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      tags: [认证]
      security: []
      operationId: loginAccount
      summary: 使用账号凭据创建数据库会话。
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 已登录并返回安全会话摘要。
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: 验证码错误、过期、已使用或请求字段无效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      tags: [认证]
      operationId: logoutAccount
      summary: 撤销当前数据库会话。
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 会话已撤销。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/setup:
    post:
      tags: [认证]
      security: []
      operationId: bootstrapOwner
      summary: 使用一次性 bootstrap token 创建引导账号；不关闭公开注册。
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapOwnerRequest"
      responses:
        "201":
          description: 引导账号已创建。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /health:
    get:
      tags: [健康检查]
      security: []
      operationId: getHealth
      summary: 检查知识库及可选计费能力。
      responses:
        "200":
          description: 服务健康状态和功能可用性。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/search:
    get:
      tags: [搜索]
      operationId: searchPersonalKnowledge
      summary: 使用单个查询字符串搜索个人知识库。
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 300
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: source
          in: query
          schema:
            $ref: "#/components/schemas/SourceKind"
      responses:
        "200":
          description: 仅返回个人知识结果。互联网搜索需通过单独调用完成。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/search/external:
    post:
      tags: [搜索]
      operationId: searchInternet
      summary: 在一次用户点击并自动确认 1 点报价后，将查询发送给已授权的互联网搜索提供商。
      description: >-
        调用方必须先为 operation=internet_search 创建并确认报价。界面入口显示“互联网搜索 · 1 点”；
        用户点击一次即同意本次搜索和 1 点扣费，客户端在同一操作中自动完成报价确认并调用本端点，
        不得再显示搜索本身的二次确认。余额不足或报价未确认时返回 402。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/BillingTaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalSearchRequest"
      responses:
        "200":
          description: >-
            短期互联网搜索候选结果。服务端可让 Search Provider 在同次查询中返回正文，用于过滤
            没有可整理正文的候选并短期缓存；正文不得返回浏览器。用户选择候选后优先单页 Fetch，
            Fetch 失败时仅可使用该候选的已缓存搜索正文兜底。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalSearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/search/external/{candidateId}/save:
    post:
      tags: [搜索, 知识]
      operationId: saveExternalCandidate
      summary: 通过 Fetch 和 AI 整理互联网候选。
      parameters:
        - $ref: "#/components/parameters/CandidateId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveExternalCandidateRequest"
      responses:
        "201":
          description: 已创建一条或多条 AI 整理后的 active 知识；不得直接保存搜索摘要或 Fetch 原文。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItemsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: 短期候选结果已过期。
        "422":
          description: 所选来源无法抓取或无法整理；其他候选结果应继续可用。
        "402":
          $ref: "#/components/responses/PaymentRequired"
  /api/v1/knowledge-items:
    get:
      tags: [知识]
      operationId: listKnowledgeItems
      summary: 分页列出 active 知识条目。
      parameters:
        - name: status
          in: query
          description: >
            单一处理状态，或逗号分隔的处理状态集合。待处理队列使用
            `pending,queued,running,processing,review,failed`，以便服务端过滤后再分页。
          schema:
            type: string
            example: review,processing,failed
        - name: source
          in: query
          schema:
            $ref: "#/components/schemas/SourceKind"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: active 知识条目。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItemPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [知识]
      operationId: createKnowledgeItem
      summary: 创建手动录入的 active 知识条目。
      description: >
        该接口只用于手动录入。`document`、`screenshot`、`internet_result` 和 `text`
        来源必须使用各自的 AI 整理入口，不能通过本接口直存原文。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeItemRequest"
      responses:
        "201":
          description: 条目已创建。计费不可用或余额不足时仍保存并标记待整理，不返回 402。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          description: 请求携带非手动专用来源类型。
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/text-imports:
    post:
      tags: [导入]
      operationId: importText
      summary: 将用户粘贴或输入的文字交给 AI 拆分整理。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextImportRequest"
      responses:
        "201":
          description: 已创建一条或多条 AI 整理后的文字知识。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItemsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: AI 服务不可用。
  /api/v1/knowledge-items/bulk-recycle:
    post:
      tags: [知识, 回收站]
      operationId: bulkMoveKnowledgeItemsToTrash
      summary: 原子地将最多 100 条知识移入回收站。
      description: |
        仅处理当前账号拥有且处于 active 状态的知识。服务端对去重后的 UUID 稳定排序，在单个事务中
        校验所有权并执行回收；任一错误都使整批回滚。相同账号、相同键和相同规范化请求体重放同一成功
        响应，同键异体返回 409。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkRecycleKnowledgeRequest"
      responses:
        "200":
          description: 全部选中知识已移入回收站并立即退出活动检索。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkRecycleKnowledgeResponse"
        "400":
          description: 条目不存在、不属于当前账号或生命周期状态不允许回收；整批未改变。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 幂等键冲突或条目已被并发请求修改；整批未改变。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/knowledge-items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [知识]
      operationId: getKnowledgeItem
      summary: 获取单个 active 知识条目。
      responses:
        "200":
          description: 完整的 active 条目。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [知识]
      operationId: updateKnowledgeItem
      summary: 更新知识条目并执行版本冲突检查。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKnowledgeItemRequest"
      responses:
        "200":
          description: 已更新的条目。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 富文本版本冲突或幂等键冲突；客户端必须按 `code` 区分。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RichTextConflictError"
                  - $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [知识, 回收站]
      operationId: moveKnowledgeItemToTrash
      summary: 将知识条目移入回收站并立即移出检索。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: 条目不再处于 active 状态，且不可搜索。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/knowledge-items/{itemId}/classifications:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    patch:
      tags: [知识]
      operationId: updateClassifications
      summary: 修正分类；编辑后的条目字段将变为锁定状态。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassificationsRequest"
      responses:
        "200":
          description: 返回已锁定的分配。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/knowledge-items/{itemId}/review:
    post:
      tags: [知识]
      operationId: confirmKnowledgeReview
      summary: 确认 AI 整理或 AI 采集结果的复核。
      description: >
        仅当前账号拥有且状态为 `review` 的 active 知识可以转为 `succeeded`。重复确认返回当前
        已整理状态且不产生重复状态事实；手动 `not_requested`、处理中或失败状态返回 409。
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: 复核已确认，返回更新后的知识条目。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/knowledge-items/{itemId}/reanalyze:
    post:
      tags: [知识, 任务]
      operationId: reanalyzeKnowledgeItem
      summary: 使用已确认的计费任务同步重新分析知识条目。
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [externalAiConsent, billingTaskId]
              properties:
                externalAiConsent:
                  type: boolean
                billingTaskId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: 已更新摘要、分类与标签并重新进入 `review`；用户锁定字段保持不变。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/imports/text:
    post:
      tags: [导入]
      operationId: importText
      summary: 导入文本并创建可立即检索的条目。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextImportRequest"
      responses:
        "202":
          description: 已接受 active 条目和后台任务；付费 AI 不可用时仍保存内容并标记待整理。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/web-imports:
    post:
      tags: [导入]
      operationId: importWebpage
      summary: 截图、OCR 并由 AI 将用户提交的单个公开网页拆分为多条知识。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebpageImportRequest"
      responses:
        "201":
          description: 页面已完成单页截图、OCR 和 AI 整理，返回本次创建的知识。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebPageImportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/document-imports:
    post:
      tags: [导入]
      operationId: importDocument
      summary: 解析文档或图片并用 AI 拆分为多条知识。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, externalAiConsent]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    PDF、DOC、DOCX、RTF、TXT、Markdown、JPG、PNG、WebP、HEIC 或 HEIF；最大 25 MiB。
                    图片必须先经过安全检查、方向规范化和 OCR，不得直接作为附件入库。
                externalAiConsent:
                  type: boolean
                note:
                  type: string
                  maxLength: 20000
      responses:
        "201":
          description: 文档或图片已解析并创建一条或多条 AI 整理知识。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebPageImportResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "413":
          description: 文档超过 25 MiB。
        "415":
          description: 文件内容不是受支持文档或图片。
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: 文档解析或 AI 服务不可用。
  /api/v1/screenshot-imports:
    post:
      tags: [导入]
      operationId: importScreenshot
      summary: OCR 剪贴板截图并用 AI 拆分为多条文字知识。
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, externalAiConsent]
              properties:
                file:
                  type: string
                  format: binary
                  description: 剪贴板 PNG 或 JPEG，最大 25 MiB。
                externalAiConsent:
                  type: boolean
                note:
                  type: string
                  maxLength: 20000
      responses:
        "201":
          description: 截图已识别并创建一条或多条文字知识。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebPageImportResponse"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "413":
          description: 截图超过 25 MiB。
        "415":
          description: 截图不是支持的 PNG/JPEG。
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: OCR 或 AI 服务不可用。
  /api/v1/imports/upload:
    post:
      tags: [导入]
      operationId: uploadKnowledgeAttachment
      summary: 旧版手动富文本正文图片附件暂存。
      deprecated: true
      description: >
        仅保留为旧版手动富文本图片兼容入口。文档采集图片必须使用
        `/api/v1/document-imports`，剪贴板截图必须使用 `/api/v1/screenshot-imports`。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, sourceType, inputMethod]
              oneOf:
                - properties:
                    sourceType:
                      const: document
                    inputMethod:
                      const: file_upload
                  required: [sourceType, inputMethod]
              properties:
                file:
                  type: string
                  format: binary
                  description: >
                    只允许手动富文本正文图片；非手动采集不得使用此端点。
                    服务端按文件内容检测 MIME，不信任扩展名或客户端 Content-Type。
                sourceType:
                  type: string
                  enum: [document]
                  description: 仅表示旧版手动正文图片。
                inputMethod:
                  type: string
                  enum: [file_upload]
                  description: 仅允许文件上传。
                note:
                  type: string
                  maxLength: 20000
                billingTaskId:
                  type: string
                  format: uuid
                  description: 付费图片文字提取的有效计费任务；缺失时只保存附件并等待整理。
      responses:
        "202":
          description: 仅在完整安全扫描通过后接受图片附件；不适用于剪贴板截图 OCR。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: 文件超过配置的上传限制。
        "415":
          description: 文件类型不支持，或与 sourceType/inputMethod 允许的媒体类型不一致。
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/jobs/{jobId}:
    get:
      tags: [任务]
      operationId: getJob
      summary: 查询任务状态和安全错误。
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 当前任务状态。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/jobs/{jobId}/retry:
    post:
      tags: [任务]
      operationId: retryJob
      summary: 使用新的计费上下文重试可恢复任务。
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: 已接受重试请求。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/jobs/{jobId}/cancel:
    post:
      tags: [任务]
      operationId: cancelJob
      summary: 取消任务并释放未消费计费预留。
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: 已接受取消请求。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/ai-consents:
    get:
      tags: [授权]
      operationId: listAIConsents
      summary: 列出当前账号在五个内容范围内的 AI 外发授权。
      responses:
        "200":
          description: 文本、网页、文档、截图和搜索范围的当前授权。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AIConsent"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/ai-consents/{scope}:
    put:
      tags: [授权]
      operationId: updateAIConsent
      summary: 授予或撤销单个范围的 AI 外发授权。
      parameters:
        - name: scope
          in: path
          required: true
          schema:
            type: string
            enum: [text, webpage, document, screenshot, search]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [granted, consentVersion]
              properties:
                granted:
                  type: boolean
                consentVersion:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "200":
          description: 已持久化的当前范围授权。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIConsent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/trash:
    get:
      tags: [回收站]
      operationId: listTrash
      summary: 分页列出回收站条目。
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 仅返回 recycled 状态的条目。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItemPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/trash/{itemId}/restore:
    post:
      tags: [回收站]
      operationId: restoreKnowledgeItem
      summary: 恢复回收站中的知识条目。
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: 条目已恢复为 active 并重新进入检索。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/trash/{itemId}:
    delete:
      tags: [回收站]
      operationId: permanentlyDeleteKnowledgeItem
      summary: 永久清除知识条目及关联内容。
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: 条目与未共享附件已永久清除。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: zhishiku_session
  parameters:
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
      description: 由 `/api/v1/auth/csrf` 获取并与当前会话绑定。
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BillingTaskId:
      name: Billing-Task-Id
      in: header
      required: false
      description: 002 计费任务标识；缺失时不得执行付费 AI，但内容仍可保存为待整理。
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: 需要身份认证。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 缺少所需的授权范围。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在，或不属于当前所有者。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 版本冲突或幂等键重复。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: 请求验证失败，且未回显敏感内容。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: 已达到提供商或本地速率限制。
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaymentRequired:
      description: 纯付费执行点数不足且尚未保存内容；保存类接口不返回 402，报价过期返回 409，缺少计费任务保存为待整理。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InsufficientPointsError"
  schemas:
    CsrfResponse:
      type: object
      required: [token, headerName]
      properties:
        token:
          type: string
        headerName:
          type: string
          const: X-XSRF-TOKEN
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
    LoginRequest:
      type: object
      required: [email, password, captchaId, captchaCode]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 256
        captchaId:
          type: string
          format: uuid
        captchaCode:
          type: string
          minLength: 4
          maxLength: 8
    CaptchaResponse:
      type: object
      required: [captchaId, image, expiresInSeconds]
      properties:
        captchaId:
          type: string
          format: uuid
        image:
          type: string
          pattern: "^data:image/png;base64,"
        expiresInSeconds:
          type: integer
          minimum: 1
        debugAnswer:
          type: string
          description: 仅本地开发 profile 返回，生产环境必须省略。
    RegistrationStatusResponse:
      type: object
      required: [open]
      properties:
        open:
          type: boolean
          description: 是否允许新邮箱注册；已有账号不会使该值变为 false。
    RegistrationEmailCodeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    RegistrationEmailCodeResponse:
      type: object
      required: [expiresInSeconds, resendAfterSeconds]
      properties:
        expiresInSeconds:
          type: integer
          minimum: 1
        resendAfterSeconds:
          type: integer
          minimum: 1
        debugCode:
          type: string
          pattern: "^\\d{6}$"
          description: 仅本地开发 profile 返回，生产环境必须省略。
    RegisterRequest:
      type: object
      required: [email, password, confirmPassword, emailCode, locale]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 256
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 256
        emailCode:
          type: string
          pattern: "^\\d{6}$"
        locale:
          type: string
          enum: [zh-CN, en]
    RegistrationResponse:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    BootstrapOwnerRequest:
      type: object
      required: [bootstrapToken, email, password, locale]
      properties:
        bootstrapToken:
          type: string
          minLength: 32
          maxLength: 512
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 256
        locale:
          type: string
          enum: [zh-CN, en]
    SessionResponse:
      type: object
      required: [ownerId, email, locale, csrfToken]
      properties:
        ownerId:
          type: string
          format: uuid
          description: 当前已认证账号 ID；字段名仅为兼容保留。
        email:
          type: string
          format: email
        locale:
          type: string
          enum: [zh-CN, en]
        csrfToken:
          type: string
    ProcessingStatus:
      type: string
      enum:
        - not_requested
        - awaiting_authorization
        - blocked_billing
        - pending
        - running
        - review
        - partial
        - succeeded
        - failed
        - cancelled
    LifecycleState:
      type: string
      enum: [active, recycled, purging]
    SourceKind:
      type: string
      enum:
        - native
        - manual
        - clipboard
        - text
        - word
        - google_docs
        - webpage
        - document
        - screenshot
        - legacy_text
        - internet_result
    ContentType:
      type: string
      enum: [text, document, image, webpage, internet_result]
    ClassificationStatus:
      type: string
      enum: [provisional, applied, locked, superseded]
    ClassificationOrigin:
      type: string
      enum: [ai, user, system]
    HealthResponse:
      type: object
      required: [status, features]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        features:
          type: object
          additionalProperties:
            type: string
            enum: [available, unavailable, degraded]
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    RichTextConflictError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [currentVersion, documentHash, latestRevisionId]
          properties:
            code:
              const: RICH_TEXT_VERSION_CONFLICT
            currentVersion:
              type: integer
              minimum: 1
            documentHash:
              type: string
              pattern: "^[a-f0-9]{64}$"
            latestRevisionId:
              type: string
              format: uuid
    InsufficientPointsError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [requiredPoints, availablePoints, shortfallPoints]
          properties:
            code:
              const: INSUFFICIENT_POINTS
            requiredPoints:
              type: integer
              minimum: 1
            availablePoints:
              type: integer
              minimum: 0
            shortfallPoints:
              type: integer
              minimum: 1
    BillingTaskSummary:
      type: object
      required: [billingTaskId, status, maxPoints, settledPoints]
      properties:
        billingTaskId:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUOTED, CONFIRMED, RESERVED, RUNNING, SETTLED, RELEASED, INSUFFICIENT, EXPIRED, CANCELLED, MANUAL_REVIEW]
        maxPoints:
          type: integer
          minimum: 1
        settledPoints:
          type: integer
          minimum: 0
        balanceAfter:
          type: integer
          minimum: 0
    Source:
      type: object
      required: [kind, inputMethod]
      properties:
        kind:
          $ref: "#/components/schemas/SourceKind"
        inputMethod:
          type: string
          enum: [manual, clipboard, file_upload, page_capture, api]
        url:
          type:
            - string
            - "null"
          format: uri
        provider:
          type:
            - string
            - "null"
        capturedAt:
          type:
            - string
            - "null"
          format: date-time
    BodySourceInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum:
            - native
            - clipboard
            - text
            - word
            - google_docs
            - webpage
            - document
            - screenshot
            - legacy_text
            - internet_result
        sourceUrl:
          type:
            - string
            - "null"
          format: uri
          description: 仅允许公开 HTTP/HTTPS URL；服务端移除片段、凭据和跟踪参数。
        capturedAt:
          type:
            - string
            - "null"
          format: date-time
          description: 外部粘贴、AI 文字、文档、截图和互联网结果类型必填；native/legacy_text 可为 null。
      allOf:
        - if:
            properties:
              kind:
                const: webpage
            required: [kind]
          then:
            properties:
              sourceUrl:
                type: string
            required: [sourceUrl]
        - if:
            properties:
              kind:
                enum: [clipboard, word, google_docs, document, screenshot, internet_result]
            required: [kind]
          then:
            properties:
              capturedAt:
                type: string
            required: [capturedAt]
    ConversionReport:
      type: object
      required:
        - preservedFeatures
        - downgradedFeatures
        - removedFeatures
        - rejectedFeatures
      properties:
        preservedFeatures:
          type: array
          items:
            type: string
        downgradedFeatures:
          type: array
          items:
            type: string
        removedFeatures:
          type: array
          items:
            type: string
        rejectedFeatures:
          type: array
          items:
            type: string
    BodyProvenance:
      type: object
      required:
        - kind
        - sourceUrl
        - capturedAt
        - convertedAt
        - converterVersion
        - contentHash
        - conversionReport
      properties:
        kind:
          type: string
          enum:
            - native
            - clipboard
            - word
            - google_docs
            - webpage
            - document
            - screenshot
            - legacy_text
            - internet_result
        sourceUrl:
          type:
            - string
            - "null"
          format: uri
        capturedAt:
          type:
            - string
            - "null"
          format: date-time
        convertedAt:
          type: string
          format: date-time
        converterVersion:
          type: string
          minLength: 1
        contentHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        conversionReport:
          $ref: "#/components/schemas/ConversionReport"
      allOf:
        - if:
            properties:
              kind:
                const: webpage
            required: [kind]
          then:
            properties:
              sourceUrl:
                type: string
            required: [sourceUrl]
        - if:
            properties:
              kind:
                enum: [clipboard, word, google_docs, document, screenshot, internet_result]
            required: [kind]
          then:
            properties:
              capturedAt:
                type: string
            required: [capturedAt]
    ClassificationAssignment:
      type: object
      required: [id, name, status, origin]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: "#/components/schemas/ClassificationStatus"
        origin:
          $ref: "#/components/schemas/ClassificationOrigin"
        confidence:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1
        lockedAt:
          type:
            - string
            - "null"
          format: date-time
    AttachmentSummary:
      type: object
      required: [id, kind, mediaType, scanState, redactionState]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [document, image, screenshot, derived_redacted_image]
        mediaType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        scanState:
          type: string
          enum: [pending, clean, rejected]
        redactionState:
          type: string
          enum: [none, redacted, not_required, rejected]
    KnowledgeItem:
      type: object
      required:
        - id
        - title
        - body
        - bodyDocument
        - bodySchemaVersion
        - bodyMigrationState
        - note
        - processingStatus
        - lifecycleState
        - redactionApplied
        - source
        - category
        - tags
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
          readOnly: true
          description: 服务端从 bodyDocument 生成的纯文本投影。
        bodyDocument:
          oneOf:
            - $ref: "../../004-rich-text-editor/contracts/rich-text.schema.json"
            - type: "null"
          description: 旧纯文本迁移完成前可为 null，此时详情必须只读展示 body，并禁止富文本编辑直到迁移完成。
        bodySchemaVersion:
          oneOf:
            - type: integer
              minimum: 1
            - type: "null"
        bodyMigrationState:
          type: string
          enum: [not_required, pending, completed, failed]
          description: pending/failed 时 bodyDocument 可为 null；前端以纯文本过渡并提示迁移状态。
        bodyProvenance:
          oneOf:
            - $ref: "#/components/schemas/BodyProvenance"
            - type: "null"
          readOnly: true
          description: 正文来源与格式转换记录；由服务端创建，不包含 Cookie、Authorization、完整剪贴板或原始 HTML。
        note:
          type: string
        summary:
          type:
            - string
            - "null"
        processingStatus:
          $ref: "#/components/schemas/ProcessingStatus"
        lifecycleState:
          $ref: "#/components/schemas/LifecycleState"
        processingErrorCode:
          type:
            - string
            - "null"
        redactionApplied:
          type: boolean
        source:
          $ref: "#/components/schemas/Source"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentSummary"
        category:
          oneOf:
            - $ref: "#/components/schemas/ClassificationAssignment"
            - type: "null"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/ClassificationAssignment"
        purgeAfter:
          type:
            - string
            - "null"
          format: date-time
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    KnowledgeItemSummary:
      type: object
      required:
        - id
        - title
        - bodyPreview
        - processingStatus
        - lifecycleState
        - source
        - category
        - tags
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        bodyPreview:
          type: string
          maxLength: 500
          description: 派生纯文本的安全短预览；列表和搜索不返回完整 bodyDocument。
        summary:
          type:
            - string
            - "null"
        processingStatus:
          $ref: "#/components/schemas/ProcessingStatus"
        lifecycleState:
          $ref: "#/components/schemas/LifecycleState"
        source:
          $ref: "#/components/schemas/Source"
        category:
          oneOf:
            - $ref: "#/components/schemas/ClassificationAssignment"
            - type: "null"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/ClassificationAssignment"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PageInfo:
      type: object
      required: [page, pageSize, totalItems, totalPages, sourceCounts]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 1
        sourceCounts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
    KnowledgeItemPage:
      type: object
      required: [items, nextCursor, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeItemSummary"
        nextCursor:
          type:
            - string
            - "null"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    BulkRecycleKnowledgeRequest:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          description: 重复 UUID 会先去重；去重后必须为 1–100 条。
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
    BulkRecycleKnowledgeResponse:
      type: object
      required: [recycled]
      properties:
        recycled:
          type: integer
          minimum: 1
          maximum: 100
          description: 已在同一事务中移入回收站的去重知识条目数。
    CreateKnowledgeItemRequest:
      type: object
      required: [title, bodyDocument]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        bodyDocument:
          $ref: "../../004-rich-text-editor/contracts/rich-text.schema.json"
        bodySource:
          $ref: "#/components/schemas/BodySourceInput"
        note:
          type: string
          maxLength: 20000
        sourceUrl:
          type:
            - string
            - "null"
          format: uri
        billingTaskId:
          type: string
          format: uuid
          description: 可选的自动整理计费任务；缺失时只保存并标记待整理。
    UpdateKnowledgeItemRequest:
      type: object
      required: [expectedVersion]
      anyOf:
        - required: [title]
        - required: [bodyDocument]
        - required: [note]
        - required: [sourceUrl]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 300
        bodyDocument:
          $ref: "../../004-rich-text-editor/contracts/rich-text.schema.json"
        bodySource:
          $ref: "#/components/schemas/BodySourceInput"
        note:
          type: string
          maxLength: 20000
        sourceUrl:
          type:
            - string
            - "null"
          format: uri
    UpdateClassificationsRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        categoryName:
          type:
            - string
            - "null"
          maxLength: 120
        tagNames:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 80
      description: 每个提交的分类字段都会成为用户锁定的分配。
    ClassificationResponse:
      type: object
      required: [itemId, category, tags, version]
      properties:
        itemId:
          type: string
          format: uuid
        category:
          oneOf:
            - $ref: "#/components/schemas/ClassificationAssignment"
            - type: "null"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/ClassificationAssignment"
        version:
          type: integer
    SearchHit:
      type: object
      required: [item, matchedFields, highlights]
      properties:
        item:
          $ref: "#/components/schemas/KnowledgeItemSummary"
        matchedFields:
          type: array
          items:
            type: string
            enum: [title, body, note, category, tag]
        highlights:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    SearchResponse:
      type: object
      required: [items, nextCursor, degraded, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        nextCursor:
          type:
            - string
            - "null"
        degraded:
          type: boolean
          description: 当请求由有界 PostgreSQL 回退方案处理时为 true。
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    ExternalSearchRequest:
      type: object
      required: [query, explicitConsent]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 300
        explicitConsent:
          type: boolean
          const: true
          description: >-
            表示用户单击“互联网搜索 · 1 点”入口后的明确外部搜索及本次 1 点扣费同意；
            该单击不要求额外的搜索确认步骤。
        includeAnswer:
          type: boolean
          default: false
          description: >-
            false 为纯搜索，固定 1 点；true 为搜索 1 点加单次回答 2 点，共 3 点。
            组合价格也必须在唯一一次点击前展示。
    ExternalSearchCandidate:
      type: object
      required: [candidateId, title, url, snippet, provider, organizable]
      properties:
        candidateId:
          type: string
          format: uuid
        title:
          type: string
        url:
          type: string
          format: uri
        snippet:
          type: string
        provider:
          type: string
        organizable:
          type: boolean
          description: 候选正文是否足以进入 AI 整理；否时前端禁用收入操作。
        expiresAt:
          type: string
          format: date-time
    ExternalSearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExternalSearchCandidate"
        answer:
          type:
            - string
            - "null"
          description: includeAnswer=true 且回答成功时的单次回答；无依据或失败时为空。
        billing:
          oneOf:
            - $ref: "#/components/schemas/BillingTaskSummary"
            - type: "null"
    SaveExternalCandidateRequest:
      type: object
      required: [externalAiConsent]
      properties:
        externalAiConsent:
          type: boolean
          const: true
        billingTaskId:
          type: string
          format: uuid
          description: 可选自动整理计费任务；生产缺少有效计费任务时不得调用 AI。
    TextImportRequest:
      type: object
      required: [text, externalAiConsent]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 30000
        externalAiConsent:
          type: boolean
          const: true
        note:
          type: string
          maxLength: 20000
    AIAuthorizationRequest:
      type: object
      required: [serviceCode, contentType, purpose, consentTextVersion]
      properties:
        serviceCode:
          type: string
          enum:
            - deepseek-classification
            - deepseek-search
            - deepseek-fetch
            - deepseek-vision
        contentType:
          $ref: "#/components/schemas/ContentType"
        purpose:
          type: string
          enum: [classify, search, fetch, vision]
        consentTextVersion:
          type: string
    AIConsent:
      type: object
      required: [scope, service, contentType, granted, consentVersion]
      properties:
        scope:
          type: string
          enum: [text, webpage, document, screenshot, search]
        service:
          type: string
        contentType:
          type: string
        granted:
          type: boolean
        consentVersion:
          type: string
        updatedAt:
          type:
            - string
            - "null"
          format: date-time
    AIAuthorization:
      type: object
      required:
        - id
        - serviceCode
        - contentType
        - purpose
        - grantedAt
      properties:
        id:
          type: string
          format: uuid
        serviceCode:
          type: string
        contentType:
          $ref: "#/components/schemas/ContentType"
        purpose:
          type: string
        consentTextVersion:
          type: string
        grantedAt:
          type: string
          format: date-time
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
    TextImportRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200000
        note:
          type: string
          maxLength: 20000
        billingTaskId:
          type: string
          format: uuid
          description: 可选自动整理计费任务；缺失时不执行付费 AI。
    WebpageImportRequest:
      type: object
      additionalProperties: false
      required: [url, externalAiConsent]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
        externalAiConsent:
          type: boolean
          description: 用户明确同意将脱敏后的 OCR 文本发送给 DeepSeek。
      description: 浏览器工作进程只能打开此单个公开 URL，并须经过 SSRF 和重定向校验。
    WebPageImportResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/KnowledgeItem"
    KnowledgeItemsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/KnowledgeItem"
    ImportAccepted:
      type: object
      required: [itemId, jobId, status, inputMethod]
      properties:
        itemId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ProcessingStatus"
        inputMethod:
          type: string
          enum: [manual, clipboard, file_upload, page_capture, api]
        billing:
          oneOf:
            - $ref: "#/components/schemas/BillingTaskSummary"
            - type: "null"
    JobAccepted:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, blocked_authorization, blocked_billing, succeeded, failed, cancelled]
    Job:
      type: object
      required: [id, kind, status, attemptCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
          enum: [queued, running, blocked_authorization, blocked_billing, succeeded, failed, cancelled]
        attemptCount:
          type: integer
          minimum: 0
        errorCode:
          type:
            - string
            - "null"
        scheduledAt:
          type: string
          format: date-time
        startedAt:
          type:
            - string
            - "null"
          format: date-time
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
